# Builds Axell Signature Dojo on a clean Ubuntu 24.04 and runs its test suites on every push.
# Least privilege: read-only token, no secrets, actions pinned to exact commits.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: System packages (the same list as scripts/setup-toolbox.sh)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config curl unzip xvfb \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target AxellSignatureDojo DojoCoreTests DojoPlatformTests -j4
      - name: Core suite
        run: ./build/DojoCoreTests
      - name: Install the released Axell plugins (the platform suite builds chains from them)
        run: |
          set -euo pipefail
          for repo in axell-penta-eq axell-duo-compressor axell-gate axell-dereverb axell-velvet axell-master axell-space axell-forbidden-seal; do
            rel=$(curl -fsSL "https://api.github.com/repos/zmardanian/$repo/releases/latest")
            tar_url=$(echo "$rel" | jq -r '.assets[] | select(.name | endswith("-linux-x86_64.tar.gz")) | .browser_download_url')
            sums_url=$(echo "$rel" | jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .browser_download_url')
            mkdir -p "dl/$repo" && cd "dl/$repo"
            curl -fsSL -O "$tar_url" && curl -fsSL -O "$sums_url"
            sha256sum -c SHA256SUMS.txt --ignore-missing
            tar xzf ./*.tar.gz && (cd ./*-linux-x86_64 && ./install.sh)
            cd ../..
          done
          ls ~/.vst3
      - name: Platform suite (sandboxed)
        run: xvfb-run -a ./build/DojoPlatformTests_artefacts/Release/DojoPlatformTests
  windows:
    # the Windows build (MSVC): the app, the core suite and the platform suite. The UAD bridge is Linux only.
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure and build (MSVC)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target AxellSignatureDojo DojoCoreTests DojoPlatformTests -- -m
      - name: Core suite
        run: ./build/Release/DojoCoreTests.exe
      - name: Install the released Axell plugins for Windows (the platform suite hosts them)
        run: |
          set -euo pipefail
          VST3="$(cygpath -u "$COMMONPROGRAMFILES")/VST3"; mkdir -p "$VST3"
          for repo in axell-penta-eq axell-duo-compressor axell-gate axell-dereverb axell-velvet axell-master axell-space axell-forbidden-seal; do
            rel=$(curl -fsSL "https://api.github.com/repos/zmardanian/$repo/releases/latest")
            url=$(echo "$rel" | jq -r '.assets[] | select(.name | endswith("-windows-x64.tar.gz")) | .browser_download_url')
            sums=$(echo "$rel" | jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .browser_download_url')
            [ -n "$url" ] || { echo "$repo: no Windows release yet"; continue; }
            mkdir -p "dl/$repo"; ( cd "dl/$repo" && curl -fsSL -O "$url" && curl -fsSL -O "$sums" && sha256sum -c SHA256SUMS.txt --ignore-missing && tar xzf ./*-windows-x64.tar.gz )
            cp -r dl/$repo/*-windows-x64/*.vst3 "$VST3/"
          done
          ls "$VST3"
      - name: Platform suite (sandboxed)
        run: |
          T=$(find build -type f -name "DojoPlatformTests.exe" -path "*Release*" | head -1); echo "found: $T"
          "$T"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AxellSignatureDojo-windows
          path: build/AxellSignatureDojo_artefacts/Release/
          retention-days: 30
